<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label>Port Folio</label>
        <br><br>

        <fieldset>
            <legend>Personal Info</legend>

            <label>FullNAme: </label>
            <input type="text">
            <br><br>

            <label>Phone No: </label>
            <input type="tel">
            <br><br>

            <label>email: </label>
            <input type="email">
            <br><br>

            <label>DOB: </label>
            <input type="date">
            <br><br>

            <label>Age: </label>
            <input type="number" max="100" min="1">
            <br><br>

            <label>Gender: </label>
            <input type="radio" checked>Male
            <input type="radio" >Female
            <br><br>

            <label>Country: </label>
            <select>
                <option>India</option>
                <option>USA</option>
                <option>Australia</option>
                <option>Dubai</option>
            </select>
            <br><br>

        </fieldset>

        <fieldset>
            <legend>Profile Information</legend>

            <label>Years of experience: </label>
            <input type="number">
            <br><br>

            <label>DevType</label>
            <input type="checkbox">Mobile
            <input type="checkbox">Frontend
            <input type="checkbox">Backend
            <br><br>

            <label>Upload resume: </label>
            <input type="file">
            <br><br>

        </fieldset>

        <fieldset>

            <legend>Extra Curricular</legend>

            <label>Hobbies: </label>
            <input type="checkbox">Sports
            <input type="checkbox">Reading
            <input type="checkbox">Music
            <br><br>

            <label>Other Achivement: </label>
            <textarea height="10" width="10"></textarea>
            <br><br>

        </fieldset>

        <input type="submit">
        <input type="reset">

    </form>
</body>
</html>
